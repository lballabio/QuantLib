name: qlnb wheels

on:
  push:
    paths:
      - "python-nanobind/**"
      - ".github/workflows/qlnb-wheels.yml"
      - "ql/**"
      - "CMakeLists.txt"
      - "cmake/**"
  pull_request:
    paths:
      - "python-nanobind/**"
      - ".github/workflows/qlnb-wheels.yml"
      - "ql/**"
      - "CMakeLists.txt"
      - "cmake/**"
  workflow_dispatch:
    inputs:
      freethreading:
        description: "Also run the optional free-threading wheel job (if runner supports it)"
        required: false
        type: boolean
        default: false

concurrency:
  group: qlnb-wheels-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_wheels:
    name: cibuildwheel (manylinux x86_64)
    runs-on: ubuntu-latest
    # Full QuantLib static link is slow/large.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22.0
        with:
          package-dir: python-nanobind
          output-dir: wheelhouse
          config-file: python-nanobind/pyproject.toml
        env:
          # Stable-ABI / cp312 tag already in pyproject; keep matrix tiny.
          CIBW_BUILD: cp312-manylinux_x86_64
          CIBW_SKIP: pp* *-musllinux_*
          CIBW_BUILD_VERBOSITY: 1
          CIBW_ENVIRONMENT: CMAKE_BUILD_PARALLEL_LEVEL=2
          # manylinux2014 ships Boost 1.53; QuantLib needs >= 1.58.
          # manylinux_2_28 (AlmaLinux 8) provides a new-enough Boost via dnf.
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BEFORE_ALL_LINUX: dnf install -y boost-devel
          CIBW_TEST_REQUIRES: pytest>=7.0 numpy>=1.24
          CIBW_TEST_COMMAND: pytest {package}/tests -q

      - uses: actions/upload-artifact@v4
        with:
          name: qlnb-wheels-manylinux-x86_64
          path: wheelhouse/*.whl
          if-no-files-found: error

  # Optional free-threading experiment. Disabled by default (if: false) so the
  # default matrix stays small; enable via workflow_dispatch input or by
  # flipping the condition when python3.13t / freethreading tags are available.
  build_wheels_freethreading:
    name: cibuildwheel (free-threading, optional)
    if: ${{ false && (github.event_name == 'workflow_dispatch' && inputs.freethreading) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Build free-threading wheels (best-effort)
        uses: pypa/cibuildwheel@v2.22.0
        with:
          package-dir: python-nanobind
          output-dir: wheelhouse
          config-file: python-nanobind/pyproject.toml
        env:
          # Placeholder tag — update when a freethreading cibuildwheel image is chosen.
          CIBW_BUILD: cp313t-manylinux_x86_64
          CIBW_SKIP: pp* *-musllinux_*
          CIBW_BUILD_VERBOSITY: 1
          CIBW_ENVIRONMENT: >-
            CMAKE_BUILD_PARALLEL_LEVEL=2
            CMAKE_ARGS=-DQLNB_THREAD_SAFE_OBSERVER=ON
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BEFORE_ALL_LINUX: dnf install -y boost-devel
          CIBW_TEST_REQUIRES: pytest>=7.0 numpy>=1.24
          CIBW_TEST_COMMAND: pytest {package}/tests -q
      - uses: actions/upload-artifact@v4
        with:
          name: qlnb-wheels-freethreading
          path: wheelhouse/*.whl
          if-no-files-found: ignore

  # Optional macOS wheels (already scaffolded). Keep disabled-by-default via
  # `if: false` so the default matrix stays manylinux-focused; flip to true
  # (or gate on workflow_dispatch) when runners/time budget allow.
  build_wheels_macos:
    name: cibuildwheel (macOS, optional)
    if: false
    runs-on: macos-14
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22.0
        with:
          package-dir: python-nanobind
          output-dir: wheelhouse
          config-file: python-nanobind/pyproject.toml
        env:
          CIBW_BUILD: cp312-macosx_arm64
          CIBW_ENVIRONMENT: CMAKE_BUILD_PARALLEL_LEVEL=2
      - uses: actions/upload-artifact@v4
        with:
          name: qlnb-wheels-macos
          path: wheelhouse/*.whl

  benchmark:
    name: qlnb benchmarks + NPV drift
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libboost-dev
          python -m pip install -U pip
          python -m pip install nanobind scikit-build-core ninja pytest numpy

      - name: Build and install qlnb
        working-directory: python-nanobind
        run: pip install --no-build-isolation .

      - name: Run unit tests
        working-directory: python-nanobind
        run: pytest -q

      - name: NPV drift check
        working-directory: python-nanobind
        run: |
          mkdir -p bench-artifacts
          python scripts/check_npv_drift.py \
            --abs-tol 1e-8 \
            --json-out bench-artifacts/npv_drift.json

      - name: Microbenchmarks (qlnb)
        working-directory: python-nanobind
        env:
          QLNB_BENCH_OUT: ${{ github.workspace }}/python-nanobind/bench-artifacts
        run: python benchmarks/bench_phase0.py | tee bench-artifacts/bench_phase0.txt

      - name: Optional SWIG comparison
        working-directory: python-nanobind
        continue-on-error: true
        env:
          QLNB_BENCH_OUT: ${{ github.workspace }}/python-nanobind/bench-artifacts
        run: |
          pip install QuantLib
          python benchmarks/bench_phase0.py | tee -a bench-artifacts/bench_phase0.txt

      - uses: actions/upload-artifact@v4
        with:
          name: qlnb-benchmark-results
          path: python-nanobind/bench-artifacts/
          if-no-files-found: error
