[build-system]
requires = [
    "scikit-build-core>=0.10",
    "nanobind>=2.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "qlnb"
version = "0.13.0"
description = "Nanobind Python bindings for QuantLib (phase 12: zero inflation / ZCIS)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [{ name = "QuantLib contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]

[project.urls]
Documentation = "https://github.com/zhangys2/QuantLib-1/blob/master/python-nanobind/docs/migration.md"
Homepage = "https://github.com/zhangys2/QuantLib-1/tree/master/python-nanobind"

[project.optional-dependencies]
test = ["pytest>=7.0", "numpy>=1.24"]
bench = ["pytest>=7.0", "numpy>=1.24"]
numpy = ["numpy>=1.24"]
dev = ["pytest>=7.0", "numpy>=1.24", "build>=1.0"]

[tool.scikit-build]
minimum-version = "0.10"
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
install.components = ["python"]
# Stable ABI wheel tag; one abi3 wheel covers CPython 3.12+.
wheel.py-api = "cp312"
# NOTE: An sdist of python-nanobind/ alone cannot build — QuantLib is compiled
# from the parent source tree (../). Prefer building wheels from a full repo
# checkout (see docs/packaging.md). These includes cover only the package tree.
sdist.include = [
    "CMakeLists.txt",
    "src/**",
    "README.md",
    "docs/**",
    "benchmarks/**",
    "scripts/**",
    "tests/**",
]
sdist.exclude = [
    "build/**",
]

[tool.scikit-build.cmake.define]
QLNB_BUILD_QUANTLIB = "ON"
# Opt-in: rebuild QuantLib with QL_ENABLE_THREAD_SAFE_OBSERVER_PATTERN.
# Override at install time: -C cmake.define.QLNB_THREAD_SAFE_OBSERVER=ON
QLNB_THREAD_SAFE_OBSERVER = "OFF"

[tool.cibuildwheel]
# Full QuantLib static link → large/slow wheels. Keep the matrix small.
build = "cp312-manylinux_x86_64"
skip = "pp* *-musllinux_*"
build-verbosity = 1
# QuantLib static build regularly exceeds default job budgets.
build-frontend = "build"
test-requires = ["pytest>=7.0", "numpy>=1.24"]
test-command = "pytest {package}/tests -q"
# Before-all: nothing special; scikit-build builds parent QuantLib.
environment = { CMAKE_BUILD_PARALLEL_LEVEL = "2" }

[tool.cibuildwheel.linux]
# manylinux2014's yum boost-devel is 1.53; QuantLib requires >= 1.58.
# Use manylinux_2_28 (AlmaLinux 8) and install Boost via dnf.
manylinux-x86_64-image = "manylinux_2_28"
before-all = "dnf install -y boost-devel"

[tool.pytest.ini_options]
testpaths = ["tests"]
